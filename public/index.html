<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 24px;
        }
        
        .brand-name {
            font-size: 32px;
            font-weight: 600;
            color: white;
            margin-bottom: 24px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .work-in-progress {
            font-size: 72px;
            font-weight: 800;
            color: white;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            letter-spacing: -2px;
        }
        
        .footer {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <nav class="navbar">
        <div class="container">
            <a href="#" class="nav-brand">智优传媒</a>
            <div class="nav-right">
                <div class="language-switcher">
                    <div class="lang-dropdown">
                        <button class="lang-btn lang-toggle" id="langToggle">
                            <span id="currentLang">中文</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div class="lang-options" id="langOptions">
                            <button class="lang-option active" data-lang="zh">
                                中文
                            </button>
                            <button class="lang-option" data-lang="en">
                                English
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="brand-name" id="brandName">加载中...</div>
        <div class="work-in-progress">WORK IN PROGRESS</div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 智优传媒. 保留所有权利。</p>
        </div>
    </footer>

    <script>
        const API_BASE_URL = 'https://geoclientbackend.shandong-buxie.workers.dev';

        const langDropdown = document.querySelector('.lang-dropdown');
        const langToggle = document.getElementById('langToggle');
        const langOptions = document.querySelectorAll('.lang-option');
        const currentLangSpan = document.getElementById('currentLang');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const brandNameEl = document.getElementById('brandName');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Load saved language
            const savedLang = localStorage.getItem('lang');
            if (savedLang) {
                langOptions.forEach(option => {
                    option.classList.remove('active');
                    if (option.dataset.lang === savedLang) {
                        option.classList.add('active');
                        currentLangSpan.textContent = option.textContent.trim();
                    }
                });
            }

            // Fetch brand data directly
            fetchBrandData();
        });

        // Toggle dropdown
        langToggle.addEventListener('click', () => {
            langDropdown.classList.toggle('open');
            langToggle.classList.toggle('active');
        });

        // Select language
        langOptions.forEach(option => {
            option.addEventListener('click', () => {
                langOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
                currentLangSpan.textContent = option.textContent.trim();
                localStorage.setItem('lang', option.dataset.lang);
                langDropdown.classList.remove('open');
                langToggle.classList.remove('active');
                
                // Update brand name display based on language
                updateBrandNameDisplay();
            });
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!langDropdown.contains(e.target)) {
                langDropdown.classList.remove('open');
                langToggle.classList.remove('active');
            }
        });

        // Fetch brand data
        async function fetchBrandData() {
            const jwtToken = localStorage.getItem('authToken');
            if (!jwtToken) {
                const lang = localStorage.getItem('lang') || 'zh';
                brandNameEl.textContent = lang === 'zh' ? '请设置认证令牌' : 'Please set auth token';
                return;
            }

            showLoading(true);

            try {
                const response = await fetch(`${API_BASE_URL}/api/my-brand`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${jwtToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (result.success && result.data) {
                    localStorage.setItem('brandData', JSON.stringify(result.data));
                    updateBrandNameDisplay();
                } else {
                    throw new Error(result.message || '获取品牌信息失败');
                }
            } catch (error) {
                console.error('Fetch brand error:', error);
                const lang = localStorage.getItem('lang') || 'zh';
                brandNameEl.textContent = lang === 'zh' ? '获取品牌信息失败' : 'Failed to get brand info';
            } finally {
                showLoading(false);
            }
        }

        // Update brand name display based on language
        function updateBrandNameDisplay() {
            const brandDataStr = localStorage.getItem('brandData');
            if (!brandDataStr) {
                fetchBrandData();
                return;
            }

            try {
                const brandData = JSON.parse(brandDataStr);
                const lang = localStorage.getItem('lang') || 'zh';
                const brandName = lang === 'zh' ? brandData.name_zh : brandData.name_en;
                brandNameEl.textContent = brandName || (lang === 'zh' ? '品牌名称' : 'Brand Name');
            } catch (e) {
                console.error('Error parsing brand data:', e);
            }
        }

        // Show/hide loading
        function showLoading(show) {
            loadingOverlay.style.display = show ? 'flex' : 'none';
        }
    </script>
</body>
</html>
