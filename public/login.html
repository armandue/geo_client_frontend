<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Ensure navbar alignment */
        .navbar .container {
            align-items: center !important;
            display: flex !important;
        }

        .nav-brand {
            line-height: normal !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            height: auto !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        .nav-right {
            display: flex !important;
            align-items: center !important;
            gap: 16px !important;
        }

        .language-switcher {
            display: flex !important;
            align-items: center !important;
        }
        
        .login-container-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .login-container {
            background: white;
            padding: 48px;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        
        .login-title {
            font-size: 32px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .login-subtitle {
            font-size: 15px;
            color: #64748b;
            text-align: center;
            margin-bottom: 32px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 16px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .nav-brand {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            cursor: pointer;
            margin-bottom: 32px;
            display: inline-block;
        }

        /* Page transition */
        .page-transition {
            transition: opacity 0.3s ease-in-out;
            opacity: 0;
        }

        .page-transition.fade-in {
            opacity: 1;
        }

        .page-transition.fade-out {
            opacity: 0;
        }
    </style>
</head>
<body class="page-transition">
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <nav class="navbar">
        <div class="container">
            <a href="#" class="nav-brand">智优传媒</a>
            <div class="nav-right">
                <div class="language-switcher">
                    <div class="lang-dropdown">
                        <button class="lang-btn lang-toggle" id="langToggle">
                            <span id="currentLang">中文</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div class="lang-options" id="langOptions">
                            <button class="lang-option active" data-lang="zh">
                                中文
                            </button>
                            <button class="lang-option" data-lang="en">
                                English
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="login-container-wrapper">
        <div class="login-container">
            <h1 class="login-title" data-i18n="login.title">商家登录</h1>
            <p class="login-subtitle" data-i18n="login.subtitle">请输入您的邮箱和密码进行登录</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <input type="email" name="email" placeholder="邮箱 *" data-i18n-placeholder="login.email" required>
                </div>
                <div class="form-group">
                    <input type="password" name="password" placeholder="密码 *" data-i18n-placeholder="login.password" required>
                </div>
                <button type="submit" class="btn-primary" data-i18n="login.submit">登录</button>
            </form>
            
            <div class="error-message" id="errorMessage" data-i18n="login.error">
                登录失败，请检查您的邮箱和密码
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://geoclientbackend.shandong-buxie.workers.dev';
        
        const loginForm = document.getElementById('loginForm');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorMessage = document.getElementById('errorMessage');
        const langDropdown = document.querySelector('.lang-dropdown');
        const langToggle = document.getElementById('langToggle');
        const langOptions = document.querySelectorAll('.lang-option');
        const currentLangSpan = document.getElementById('currentLang');

        // i18n translations
        const translations = {
            zh: {
                'login.title': '商家登录',
                'login.subtitle': '请输入您的邮箱和密码进行登录',
                'login.email': '邮箱 *',
                'login.password': '密码 *',
                'login.submit': '登录',
                'login.error': '登录失败，请检查您的邮箱和密码'
            },
            en: {
                'login.title': 'Merchant Login',
                'login.subtitle': 'Please enter your email and password to login',
                'login.email': 'Email *',
                'login.password': 'Password *',
                'login.submit': 'Login',
                'login.error': 'Login failed, please check your email and password'
            }
        };

        // Apply translations to page
        function applyTranslations(lang) {
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            const placeholders = document.querySelectorAll('[data-i18n-placeholder]');
            placeholders.forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });
        }

        // Get language from URL
        function getLangFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('lang');
        }

        // Update URL with language parameter
        function updateUrlWithLang(lang) {
            const url = new URL(window.location.href);
            url.searchParams.set('lang', lang);
            window.history.replaceState({}, '', url.toString());
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Fade in effect
            setTimeout(() => {
                document.body.classList.add('fade-in');
            }, 50);

            // First check URL for language
            const urlLang = getLangFromUrl();
            let langToUse = urlLang || localStorage.getItem('lang') || 'zh';
            
            // Sync to localStorage
            localStorage.setItem('lang', langToUse);
            
            // Update UI
            langOptions.forEach(option => {
                option.classList.remove('active');
                if (option.dataset.lang === langToUse) {
                    option.classList.add('active');
                    currentLangSpan.textContent = option.textContent.trim();
                }
            });
            
            // Update URL if language was from localStorage
            if (!urlLang) {
                updateUrlWithLang(langToUse);
            }
            
            applyTranslations(langToUse);
        });

        // Toggle dropdown
        langToggle.addEventListener('click', () => {
            langDropdown.classList.toggle('open');
            langToggle.classList.toggle('active');
        });

        // Select language
        langOptions.forEach(option => {
            option.addEventListener('click', () => {
                langOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
                currentLangSpan.textContent = option.textContent.trim();
                localStorage.setItem('lang', option.dataset.lang);
                updateUrlWithLang(option.dataset.lang);
                applyTranslations(option.dataset.lang);
                langDropdown.classList.remove('open');
                langToggle.classList.remove('active');
            });
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!langDropdown.contains(e.target)) {
                langDropdown.classList.remove('open');
                langToggle.classList.remove('active');
            }
        });

        // Login form submit
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(loginForm);
            const email = formData.get('email');
            const password = formData.get('password');

            errorMessage.classList.remove('show');

            try {
                const loginResponse = await fetch(`${API_BASE_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const loginResult = await loginResponse.json();

                if (loginResponse.ok && loginResult.access_token) {
                    localStorage.setItem('authToken', `${loginResult.token_type} ${loginResult.access_token}`);
                    localStorage.setItem('tokenType', loginResult.token_type);
                    localStorage.setItem('accessToken', loginResult.access_token);
                    localStorage.setItem('expiresIn', loginResult.expires_in);
                    localStorage.setItem('brandInfo', JSON.stringify(loginResult.brand));
                    const currentLang = localStorage.getItem('lang') || 'zh';
                    document.body.classList.add('fade-out');
                    setTimeout(() => {
                        window.location.href = `/?lang=${currentLang}`;
                    }, 300);
                } else {
                    throw new Error(loginResult.message || '登录失败');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = error.message || '登录失败，请检查您的邮箱和密码';
                errorMessage.classList.add('show');
            }
        });
    </script>
</body>
</html>
