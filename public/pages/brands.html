<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家详情 - 智优传媒</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body class="page-transition">
    <div class="dashboard-container"><main class="dashboard-main">
        <div class="pane-header"><h2 class="pane-title" id="pageMainTitle">商家详情</h2><p class="pane-subtitle" id="pageMainSubtitle">查看与管理您的品牌入驻档案与账户配置</p></div>
        <div class="content-card"><div class="detail-grid">
            <div class="detail-item"><span class="detail-label" id="detLabelNameZh">品牌名称（中文）</span><span class="detail-value" id="detValueNameZh">加载中...</span></div>
            <div class="detail-item"><span class="detail-label" id="detLabelNameEn">品牌名称（英文）</span><span class="detail-value" id="detValueNameEn">Loading...</span></div>
            <div class="detail-item"><span class="detail-label" id="detLabelStatus">合作状态</span><span class="detail-value" style="color:#10b981;font-weight:700;" id="detValueStatus">● 合作认证商家</span></div>
            <div class="detail-item"><span class="detail-label" id="detLabelSupport">专属客户顾问</span><span class="detail-value" id="detValueSupport">智优传媒 GEO优化团队</span></div>
        </div></div>
    </main></div>
    <script src="../js/dashboard-layout.js"></script><script src="../js/dashboard.js"></script>
    <script>
        const pageI18n = { zh: { pageTitle:'商家详情 - 智优传媒', pageMainTitle:'商家详情', pageMainSubtitle:'查看与管理您的品牌入驻档案与账户配置', detLabelNameZh:'品牌名称（中文）', detLabelNameEn:'品牌名称（英文）', detLabelStatus:'合作状态', detValueStatus:'● 合作认证商家', detLabelSupport:'专属客户顾问', detValueSupport:'智优传媒 GEO优化团队' }, en: { pageTitle:'Merchant Details - GeoMedia', pageMainTitle:'Merchant Details', pageMainSubtitle:'Review and manage your brand registration profile and account settings', detLabelNameZh:'Brand Name (Chinese)', detLabelNameEn:'Brand Name (English)', detLabelStatus:'Partnership Status', detValueStatus:'● Verified Active Merchant', detLabelSupport:'Dedicated Consultant', detValueSupport:'GeoMedia Optimization Team' } };
        window.onPageLanguageChange = function (lang) { const t = pageI18n[lang] || pageI18n.zh; document.title = t.pageTitle; ['pageMainTitle','pageMainSubtitle','detLabelNameZh','detLabelNameEn','detLabelStatus','detValueStatus','detLabelSupport','detValueSupport'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = t[id]; }); };
    </script>
</body>
</html>
