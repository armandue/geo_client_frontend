<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网红推广 - 智优传媒</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="page-transition">
    <div class="dashboard-container">
        <main class="dashboard-main">
            <div class="pane-header" style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;">
                <div>
                    <h2 class="pane-title" id="pageMainTitle">网红推广</h2>
                    <p class="pane-subtitle" id="pageMainSubtitle">达人报名及活动信息</p>
                </div>
                <button id="refreshClaimsBtn" type="button" class="action-btn" style="padding:9px 16px;">刷新</button>
            </div>
            <div id="claimsSummary" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;"></div>
            <div id="claimsList" aria-live="polite">
                <div id="claimsLoading" class="content-card" style="text-align:center;padding:32px;color:var(--text-muted);">正在加载报名信息...</div>
            </div>
        </main>
    </div>
    <script src="../js/dashboard-layout.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/components/claims.js"></script>
    <script>
        window.onPageLanguageChange = function (lang) {
            const labels = lang === 'en'
                ? { title: 'Influencer Marketing', subtitle: 'Creator applications and campaign details', refresh: 'Refresh' }
                : { title: '网红推广', subtitle: '达人报名及活动信息', refresh: '刷新' };
            document.title = `${labels.title} - GeoMedia`;
            const title = document.getElementById('pageMainTitle');
            const subtitle = document.getElementById('pageMainSubtitle');
            const refresh = document.getElementById('refreshClaimsBtn');
            if (title) title.textContent = labels.title;
            if (subtitle) subtitle.textContent = labels.subtitle;
            if (refresh) refresh.textContent = labels.refresh;
            if (typeof window.loadClaimsFromComponent === 'function') window.loadClaimsFromComponent(true);
        };
    </script>
</body>
</html>
