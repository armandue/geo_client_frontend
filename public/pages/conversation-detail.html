<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对话详情 - 智优传媒</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="page-transition">
    <div class="dashboard-container">
        <main class="dashboard-main">
            <div style="margin-bottom:20px;">
                <a id="backToConversationsLink" href="/index.html/conversations" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:#fff;border:1px solid var(--border-color);border-radius:8px;color:var(--text-main);cursor:pointer;font-size:.85rem;text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.05);"><span aria-hidden="true">‹</span><span id="backToConversationsLabel">返回对话</span></a>
            </div>
            <div class="pane-header" style="margin-bottom:20px;">
                <h2 class="pane-title" id="conversationDetailCreator">对话详情</h2>
                <p class="pane-subtitle" id="conversationDetailRequest"></p>
            </div>
            <section id="conversationMessages" class="content-card" aria-live="polite" style="display:flex;flex-direction:column;gap:12px;min-height:220px;">
                <p id="conversationDetailLoading" style="margin:auto;color:var(--text-muted);text-align:center;">正在加载消息...</p>
            </section>
        </main>
    </div>
    <script src="../js/dashboard-layout.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/components/conversation-detail.js"></script>
</body>
</html>
