<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动详情 - 智优传媒</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="page-transition">
    <div class="dashboard-container"><main class="dashboard-main">
        <section id="section-request-detail" class="spa-section" style="display:block;">
            <div style="margin-bottom:20px;"><button id="detailBackBtn" onclick="window.location.href='/pages/requests.html'" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:#fff;border:1px solid var(--border-color);border-radius:8px;color:var(--text-main);cursor:pointer;font-size:.85rem;"><span>‹</span><span id="detailBackLabel">返回活动列表</span></button></div>
            <div class="pane-header" style="margin-bottom:24px;width:100%;"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;"><span id="detailRewardIcon" style="font-size:32px;">🍽️</span><div><h2 class="pane-title" id="detailTitle" style="margin:0 0 6px;">活动详情</h2><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><span id="detailStatusBadge" style="font-size:.78rem;padding:3px 10px;border-radius:12px;background:rgba(16,185,129,.15);color:#10b981;">🟢 招募中</span><span id="detailRewardBadge" style="font-size:.78rem;padding:3px 10px;border-radius:12px;background:#f1f5f9;color:var(--text-muted);">免费餐饮</span></div></div></div></div>
            <div class="content-card" style="margin-bottom:24px;"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;"><div><span class="detail-label" id="detailLabelDate">活动时间</span><div id="detailDateRange" class="detail-value">—</div></div><div><span class="detail-label" id="detailLabelBudget">预算金额</span><div id="detailBudget" class="detail-value">—</div></div><div><span class="detail-label" id="detailLabelCreated">创建时间</span><div id="detailCreatedAt" class="detail-value">—</div></div></div></div>
            <div class="content-card" style="margin-bottom:24px;"><span class="detail-label" id="detailLabelPerks">活动福利</span><div id="detailPerks" class="detail-value">—</div></div>
            <div class="content-card" style="margin-bottom:24px;"><h4 id="detailLabelDesc">活动描述</h4><p id="detailDescription" style="margin:0;color:var(--text-main);font-size:.95rem;line-height:1.8;white-space:pre-wrap;"></p></div>
            <div id="detailRequirementsCard" class="content-card"><h4 id="detailLabelReqs">平台招募要求</h4><div id="detailRequirementsList"></div></div>
            <div id="detailImagesCard" class="content-card" style="margin-top:24px;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;"><h4 id="detailLabelImages">活动图片</h4><span id="detailImageCount" style="font-size:.8rem;color:var(--text-muted);"></span></div><div id="detailImageGrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;"></div><div id="imageDropZone" style="border:2px dashed var(--border-color);border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;background:var(--bg-page);"><div id="dropZoneText">点击或拖拽图片上传</div><div id="dropZoneHint" style="color:var(--text-muted);font-size:.75rem;margin-top:4px;">JPG / PNG / WebP，最大 10MB</div><input type="file" id="imageFileInput" accept="image/jpeg,image/png,image/webp" multiple style="display:none;"></div><div id="imageUploadProgress" style="display:none;margin-top:14px;"><span id="imageUploadStatus">上传中...</span><div style="height:4px;background:var(--border-color);margin-top:6px;"><div id="imageUploadBar" style="height:100%;background:var(--primary-color);width:0%;"></div></div></div></div>
        </section>
    </main></div>
    <script src="../js/dashboard-layout.js"></script><script src="../js/dashboard.js"></script>
    <script>window.onPageLanguageChange = function (lang) { const labels = lang === 'en' ? { back:'Back to Campaigns', title:'Campaign Detail' } : { back:'返回活动列表', title:'活动详情' }; const back = document.getElementById('detailBackLabel'); const title = document.getElementById('detailTitle'); if (back) back.textContent = labels.back; if (title && title.textContent === '活动详情') title.textContent = labels.title; };</script>
</body>
</html>
