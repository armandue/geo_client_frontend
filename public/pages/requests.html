<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动召集 - 智优传媒</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="page-transition">
    <div class="dashboard-container"><main class="dashboard-main">
        <div class="pane-header" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;"><div><h2 class="pane-title" id="pageMainTitle">活动召集</h2><p class="pane-subtitle" id="pageMainSubtitle">规划并发布达人探店、体验召集与推广任务</p></div><button type="button" class="action-btn" style="padding:10px 20px;" id="btnCreateCampaign">+ 发起新活动</button></div>
        <div class="content-card"><div class="message-list" id="campaignList"><div id="campaignLoading" style="text-align:center;padding:32px;color:#6b7280;font-size:.9rem;"><svg style="animation:spin 1s linear infinite;display:inline-block;margin-bottom:8px;" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg><br>加载活动列表...</div></div></div>
    </main></div>
    <script src="../js/dashboard-layout.js"></script><script src="../js/dashboard.js"></script>
    <script>window.onPageLanguageChange = function (lang) { const t = lang === 'en' ? { title:'Campaign Recruitment', subtitle:'Schedule and coordinate store reviews and influencer campaigns', create:'+ Create Campaign' } : { title:'活动召集', subtitle:'规划并发布达人探店、体验召集与推广任务', create:'+ 发起新活动' }; const map = { pageMainTitle:t.title, pageMainSubtitle:t.subtitle, btnCreateCampaign:t.create }; Object.keys(map).forEach(id => { const el = document.getElementById(id); if (el) el.textContent = map[id]; }); };</script>
</body>
</html>
